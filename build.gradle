plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base { archivesName = 'PURPURE-3D' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { purpure { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {}

dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }

processResources {
    def props = [minecraft_version:minecraft_version, forge_version:forge_version, mod_id:mod_id, mod_name:mod_name, mod_version:mod_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    archiveFileName = 'PURPURE-3D-Forge-1.20.1.jar'
    manifest { attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version, 'Implementation-Vendor': 'IGY_gaming') }
    finalizedBy 'reobfJar'
}
