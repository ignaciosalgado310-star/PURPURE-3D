name: Build PURPURE 3D

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Prepare approved V15 assets
        run: |
          # Audio original de PURPURE-3D. No se recorta ni se acelera.
          cat \
            src/main/resources/assets/purpure/sounds/hollow_purple_video.fixed.00.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_video.fixed.01.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_video.fixed.02.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_video.fixed.03.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_video.fixed.04a.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_video.fixed.04b.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_video.fixed.05.b64 \
            > /tmp/hollow_purple_video.b64
          base64 -d /tmp/hollow_purple_video.b64 > src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg

          # Frase de invocacion limpia ya perteneciente al proyecto.
          cat \
            src/main/resources/assets/purpure/sounds/hollow_purple_invoke.00.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_invoke.01.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_invoke.02.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_invoke.03a.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_invoke.03b.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_invoke.04.b64 \
            src/main/resources/assets/purpure/sounds/hollow_purple_invoke.05.b64 \
            > /tmp/hollow_purple_invoke.b64
          base64 -d /tmp/hollow_purple_invoke.b64 > src/main/resources/assets/purpure/sounds/hollow_purple_invoke.ogg

          # Skin exacta tomada del GOJO-3D funcional (evita el modelo negro).
          base64 -d src/main/resources/assets/purpure/textures/entity/gojo_skin.b64 > src/main/resources/assets/purpure/textures/entity/gojo_skin.png

          # ArmorStand solo como ancla/logica; Gojo visual lo dibuja el cliente.
          sed -i 's/gojo.setInvisible(false);/gojo.setInvisible(true);/' src/main/java/igy/purpure/server/PurpureServerEvents.java
          sed -i 's/gojo.setItemSlot(EquipmentSlot.HEAD, createGojoHead());/gojo.setItemSlot(EquipmentSlot.HEAD, ItemStack.EMPTY);/' src/main/java/igy/purpure/server/PurpureServerEvents.java
          sed -i 's/gojo.setItemSlot(EquipmentSlot.CHEST, blackLeather(Items.LEATHER_CHESTPLATE));/gojo.setItemSlot(EquipmentSlot.CHEST, ItemStack.EMPTY);/' src/main/java/igy/purpure/server/PurpureServerEvents.java
          sed -i 's/gojo.setItemSlot(EquipmentSlot.LEGS, blackLeather(Items.LEATHER_LEGGINGS));/gojo.setItemSlot(EquipmentSlot.LEGS, ItemStack.EMPTY);/' src/main/java/igy/purpure/server/PurpureServerEvents.java
          sed -i 's/gojo.setItemSlot(EquipmentSlot.FEET, blackLeather(Items.LEATHER_BOOTS));/gojo.setItemSlot(EquipmentSlot.FEET, ItemStack.EMPTY);/' src/main/java/igy/purpure/server/PurpureServerEvents.java

          # Renderers viejos que no forman parte del visor aprobado.
          rm -f src/main/java/igy/purpure/client/ClientCasterAnimation.java
          rm -f src/main/java/igy/purpure/client/ClientEnergyEnhancements.java
          rm -f src/main/java/igy/purpure/client/ClientCinematicDirector.java
          rm -f src/main/java/igy/purpure/client/ClientGojoCaster.java
          rm -f src/main/java/igy/purpure/client/ClientAnimePolish.java

          # No empaquetar las fuentes Base64.
          rm -f src/main/resources/assets/purpure/sounds/hollow_purple_video.b64
          rm -f src/main/resources/assets/purpure/sounds/hollow_purple_video.0*.b64
          rm -f src/main/resources/assets/purpure/sounds/hollow_purple_video.fixed.*.b64
          rm -f src/main/resources/assets/purpure/sounds/hollow_purple_invoke.0*.b64
          rm -f src/main/resources/assets/purpure/textures/entity/gojo_skin.b64

      - name: Verify approved assets and command
        run: |
          test -s src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg
          test -s src/main/resources/assets/purpure/sounds/hollow_purple_invoke.ogg
          test -s src/main/resources/assets/purpure/textures/entity/gojo_skin.png

          # La skin es el mismo PNG empaquetado por GOJO-3D.
          test "$(stat -c%s src/main/resources/assets/purpure/textures/entity/gojo_skin.png)" = "5113"

          # El comando sigue sin limite artificial de 300; acepta 9999 y mas.
          grep -Fq 'Commands.literal("purpure")' src/main/java/igy/purpure/server/PurpureServerEvents.java
          grep -Fq 'IntegerArgumentType.integer(1)' src/main/java/igy/purpure/server/PurpureServerEvents.java
          grep -Fq 'broadcastEntityEvent(player, (byte)35)' src/main/java/igy/purpure/server/PurpureServerEvents.java

          # Validar ambos OGG. El principal conserva timing/contenido y solo se
          # sanea a un contenedor Vorbis válido para Minecraft.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null

          # El audio heredado del repo contiene CRC OGG dañados. FFmpeg puede
          # decodificarlo completo; lo reempaquetamos/re-codificamos SIN cambiar
          # velocidad, duración, tono ni contenido temporal para evitar fallos
          # del decoder de Minecraft/OpenAL.
          mv src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg /tmp/hollow_purple_video_source.ogg
          SOURCE_DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/hollow_purple_video_source.ogg 2>/tmp/source_crc.warn)"
          ffmpeg -y -v warning -i /tmp/hollow_purple_video_source.ogg \
            -map_metadata -1 -c:a libvorbis -q:a 5 -ar 22050 -ac 1 \
            src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg \
            2>/tmp/source_decode.warn
          test -s src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg

          FINAL_DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg)"
          awk -v a="$SOURCE_DURATION" -v b="$FINAL_DURATION" 'BEGIN { d=a-b; if (d<0) d=-d; exit !(a>12.0 && a<12.3 && b>12.0 && b<12.3 && d<0.02) }'

          echo "Audio principal:"
          sha256sum src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg
          # El audio principal ya era el audio del mod; ffprobe confirma su duracion.
          # No bloqueamos el build por warnings CRC del contenedor OGG heredado.
          ffprobe -v warning -show_entries format=duration -of default=nw=1:nk=1 src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg || true

          echo "Audio invocacion:"
          sha256sum src/main/resources/assets/purpure/sounds/hollow_purple_invoke.ogg
          test "$(sha256sum src/main/resources/assets/purpure/sounds/hollow_purple_invoke.ogg | cut -d' ' -f1)" = "4adeced1d7398a4cbb26fd7c29b14416f5388c90e633ad5a921c2aa7d1310e7e"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 src/main/resources/assets/purpure/sounds/hollow_purple_invoke.ogg
          ffmpeg -v error -i src/main/resources/assets/purpure/sounds/hollow_purple_invoke.ogg -f null - 2> /tmp/invoke_decode.err
          cat /tmp/invoke_decode.err
          test ! -s /tmp/invoke_decode.err

      - name: Build Forge mod
        run: gradle clean build --stacktrace

      - name: Verify built JAR
        run: |
          JAR=build/libs/PURPURE-3D-Forge-1.20.1.jar
          test -s "$JAR"

          jar tf "$JAR" | grep -Fq 'assets/purpure/textures/entity/gojo_skin.png'
          jar tf "$JAR" | grep -Fq 'assets/purpure/sounds/hollow_purple_video.ogg'
          jar tf "$JAR" | grep -Fq 'assets/purpure/sounds/hollow_purple_invoke.ogg'
          jar tf "$JAR" | grep -Fq 'igy/purpure/client/ClientGojoAttack.class'
          jar tf "$JAR" | grep -Fq 'igy/purpure/client/ClientGojoSkinCaster.class'
          jar tf "$JAR" | grep -Fq 'igy/purpure/server/PurpureServerEvents.class'

          # El renderer de lineas viejo no debe volver a colarse.
          if jar tf "$JAR" | grep -Fq 'ClientAnimePolish.class'; then
            echo 'ERROR: ClientAnimePolish viejo fue empaquetado'
            exit 1
          fi

          echo 'Contenido PURPURE clave:'
          jar tf "$JAR" | grep -E 'ClientGojoAttack|ClientGojoSkinCaster|PurpureServerEvents|gojo_skin|hollow_purple'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PURPURE-3D-Forge-1.20.1
          path: build/libs/PURPURE-3D-Forge-1.20.1.jar
          if-no-files-found: error
