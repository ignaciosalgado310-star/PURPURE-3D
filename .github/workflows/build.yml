name: Build PURPURE 3D

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Prepare PURPURE 3D V9
        run: |
          # Reconstruye dentro del JAR el audio completo extraido del video de referencia.
          base64 -d src/main/resources/assets/purpure/sounds/hollow_purple_video.b64 > src/main/resources/assets/purpure/sounds/hollow_purple_video.ogg
          rm -f src/main/resources/assets/purpure/sounds/hollow_purple_video.b64

          # Renderers experimentales anteriores: la version actual usa ClientGojoAttack.
          rm -f src/main/java/igy/purpure/client/ClientCasterAnimation.java
          rm -f src/main/java/igy/purpure/client/ClientEnergyEnhancements.java
          rm -f src/main/java/igy/purpure/client/ClientCinematicDirector.java
          rm -f src/main/java/igy/purpure/client/ClientGojoSkinCaster.java
          rm -f src/main/java/igy/purpure/client/ClientGojoCaster.java
          rm -f src/main/resources/assets/purpure/textures/entity/gojo_skin.b64

      - name: Build Forge mod
        run: gradle clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PURPURE-3D-Forge-1.20.1
          path: build/libs/PURPURE-3D-Forge-1.20.1.jar
          if-no-files-found: error
