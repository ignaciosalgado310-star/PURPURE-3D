name: Build PURPURE 3D

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Prepare Gojo NPC build
        run: |
          rm -f src/main/resources/assets/purpure/sounds/hollow_purple_video.b64
          rm -f src/main/java/igy/purpure/client/ClientCasterAnimation.java
          rm -f src/main/java/igy/purpure/client/ClientEnergyEnhancements.java
          rm -f src/main/java/igy/purpure/client/ClientCinematicDirector.java

          python3 - <<'PY'
          from pathlib import Path

          # El mapa ACTIVE sigue controlando paquetes/timing, pero apagamos su render viejo.
          effects = Path('src/main/java/igy/purpure/client/ClientPurpureEffects.java')
          text = effects.read_text()
          old = 'if (event.getStage() != RenderLevelStageEvent.Stage.AFTER_PARTICLES || ACTIVE.isEmpty()) return;'
          if old in text:
              text = text.replace(old, 'if (true) return;', 1)
          effects.write_text(text)

          # Conservamos los orbes/fusion de ClientGojoAttack, pero el Gojo visual ahora
          # es el ArmorStand real creado por el servidor para garantizar que aparezca.
          attack = Path('src/main/java/igy/purpure/client/ClientGojoAttack.java')
          text = attack.read_text()
          text = text.replace('ClientGojoCaster.render(pose, t);', '// Gojo visual = NPC server-side', 1)

          old = 'float t = base + partial;'
          new = 'float t = (base + partial) * 0.68f;'
          if old not in text:
              raise SystemExit('Could not find ClientGojoAttack time line')
          text = text.replace(old, new, 1)
          text = text.replace('1.18f', '0.92f')
          text = text.replace('6.95f', '3.85f')
          text = text.replace('smooth(330.0f, 365.0f, t)', 'smooth(210.0f, 235.0f, t)')
          attack.write_text(text)

          # El golpe/destruccion cae cerca del final hablado del audio.
          server = Path('src/main/java/igy/purpure/server/PurpureServerEvents.java')
          text = server.read_text()
          if 'private static final int IMPACT = 190;' not in text:
              raise SystemExit('Could not find server impact timing')
          text = text.replace('private static final int IMPACT = 190;', 'private static final int IMPACT = 300;', 1)
          server.write_text(text)
          PY

      - name: Build Forge mod
        run: gradle clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PURPURE-3D-Forge-1.20.1
          path: build/libs/PURPURE-3D-Forge-1.20.1.jar
          if-no-files-found: error
