name: Build fixed GOKU FX

on:
  push:
    branches: [ "main" ]
    paths:
      - "goku-build/**"
      - ".github/workflows/build-gokufx-proxy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build GOKU-FX
        working-directory: goku-build
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify Kame and Genki skin-fix build
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find goku-build/build/libs -maxdepth 1 -name '*.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'com/igygaming/gokufx/client/ClientKameV12Renderer.class'
          jar tf "$JAR" | grep -q 'com/igygaming/gokufx/client/ClientGenkiRenderer.class'
          jar tf "$JAR" | grep -q 'assets/gokufx/textures/entity/goku_ssb.png'
          jar tf "$JAR" | grep -q 'assets/gokufx/textures/entity/genki_goku.png'

      - name: Upload fixed JAR
        uses: actions/upload-artifact@v4
        with:
          name: GOKU-FX-1.20.1-SKIN-FIX
          path: goku-build/build/libs/*.jar
          if-no-files-found: error
