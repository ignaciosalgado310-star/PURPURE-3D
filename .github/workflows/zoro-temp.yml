name: Temp Build ZORO-3D

on:
  push:
    branches: [ "temp-zoro-build" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Forge mod
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZORO-3D-BUILD-LOG
          path: build.log
          if-no-files-found: error

      - name: Upload JAR
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ZORO-3D-JAR
          path: build/libs/ZORO-3D-Forge-1.20.1.jar
          if-no-files-found: error

      - name: Mark build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
