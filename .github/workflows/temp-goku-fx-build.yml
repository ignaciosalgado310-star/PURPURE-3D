name: Temp Build GOKU FX Fixed

on:
  push:
    branches: [ "temp-goku-fx-build-20260928" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goku-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Decode exact Goku skins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/resources/assets/gokufx/textures/entity
          base64 -d skin-b64/goku_ssb.png.b64 > src/main/resources/assets/gokufx/textures/entity/goku_ssb.png
          base64 -d skin-b64/genki_goku.png.b64 > src/main/resources/assets/gokufx/textures/entity/genki_goku.png
          file src/main/resources/assets/gokufx/textures/entity/goku_ssb.png
          file src/main/resources/assets/gokufx/textures/entity/genki_goku.png

      - name: Build current GOKU FX
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify fixed renderers
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' | head -n 1)"
          jar tf "$JAR" | grep -q 'com/igygaming/gokufx/client/ClientKameV12Renderer.class'
          jar tf "$JAR" | grep -q 'com/igygaming/gokufx/client/ClientGenkiRenderer.class'
          jar tf "$JAR" | grep -q 'assets/gokufx/textures/entity/goku_ssb.png'
          jar tf "$JAR" | grep -q 'assets/gokufx/textures/entity/genki_goku.png'

      - name: Upload fixed JAR
        uses: actions/upload-artifact@v4
        with:
          name: GOKU-FX-1.20.1-SKIN-FIX
          path: goku-builder/build/libs/*.jar
          if-no-files-found: error
